name: Publish public backlog

'on':
  push:
    branches: [main]
    paths:
      - docs/project-backlog.md
      - scripts/build-public-backlog.mjs
      - public/brand/bitcoinwalk-horizontal.png
      - .github/workflows/backlog-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Build public-safe backlog
        run: node scripts/build-public-backlog.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public-backlog-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
